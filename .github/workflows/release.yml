# Publishes a GitHub Release with store-signed APKs when a version tag (v1.2.3) is pushed.
#
# The signing key never goes into the repository. Add these repository secrets first
# (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    the .jks file, base64-encoded (e.g. `base64 -w0 jolpai-release.jks`)
#   KEYSTORE_PASSWORD  the store password
#   KEY_ALIAS          the key alias (jolpai)
#   KEY_PASSWORD       the key password
# Without them the workflow stops before building, so an unsigned release is never published.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Check the signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing; see the top of release.yml"; exit 1; fi
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore the signing key (runner only, deleted at the end)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jolpai-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/jolpai-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test
        run: ./gradlew test --stacktrace

      - name: Build store-signed APKs
        run: ./gradlew :app-shell:assembleRelease -PstoreKey --stacktrace

      - name: Name the APKs after the version
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          for f in app-shell/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/app-shell-(.*)-release\.apk/\1/')
            cp "$f" "dist/jolpai-keyboard-${version}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      # docs/release-notes/<tag>.md if there is one, then the checksums.
      - name: Write the release notes
        id: notes
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cat "$notes"; else echo "Jolpai Keyboard ${GITHUB_REF_NAME#v}"; fi > dist/NOTES.md
          { echo; echo '**SHA-256 checksums**'; echo '```'; cat dist/SHA256SUMS.txt; echo '```'; } >> dist/NOTES.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Jolpai Keyboard ${{ steps.notes.outputs.version }} (beta)
          body_path: dist/NOTES.md
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/jolpai-release.jks" keystore.properties
