# Releases Jolpai automatically: on every push to main it reads versionName from
# app-shell/build.gradle.kts, and if there is no release for that version yet it runs the tests,
# builds store-signed APKs, creates the tag v<version> and publishes the GitHub Release.
# To release: bump versionName (and versionCode), add docs/release-notes/v<version>.md, push.
# Pushes that don't change the version stop after the quick check. Pushing a v* tag by hand,
# or "Run workflow" in the Actions tab, still works too.
#
# The signing key never goes into the repository. Add these repository secrets first
# (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    the .jks file, base64-encoded (e.g. `base64 -w0 jolpai-release.jks`)
#   KEYSTORE_PASSWORD  the store password
#   KEY_ALIAS          the key alias (jolpai)
#   KEY_PASSWORD       the key password
# Without them the workflow stops before building, so an unsigned release is never published.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Is this a new version?
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(sed -nE 's/^\s*versionName\s*=\s*"([^"]+)".*/\1/p' app-shell/build.gradle.kts | head -1)
            if [ -z "$version" ]; then echo "::error::versionName not found in app-shell/build.gradle.kts"; exit 1; fi
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists: nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $tag: releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing; see the top of release.yml"; exit 1; fi
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore the signing key (runner only, deleted at the end)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jolpai-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/jolpai-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test
        run: ./gradlew test --stacktrace

      - name: Build store-signed APKs
        run: ./gradlew :app-shell:assembleRelease -PstoreKey --stacktrace

      - name: Name the APKs after the version
        run: |
          mkdir -p dist
          for f in app-shell/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/app-shell-(.*)-release\.apk/\1/')
            cp "$f" "dist/jolpai-keyboard-${VERSION}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      # docs/release-notes/<tag>.md if there is one, then the checksums.
      - name: Write the release notes
        run: |
          notes="docs/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then cat "$notes"; else echo "Jolpai Keyboard ${VERSION}"; fi > dist/NOTES.md
          { echo; echo '**SHA-256 checksums**'; echo '```'; cat dist/SHA256SUMS.txt; echo '```'; } >> dist/NOTES.md

      # Creates the tag on this commit if it doesn't exist yet.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Jolpai Keyboard ${{ env.VERSION }} (beta)
          body_path: dist/NOTES.md
          make_latest: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/jolpai-release.jks" keystore.properties
