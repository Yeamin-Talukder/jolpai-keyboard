<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy policy – Jolpai Keyboard</title>
<meta name="description" content="What Jolpai Keyboard stores on your phone, what it sends, and how to control it. No ads, no analytics, no account; learned words stay on your device, encrypted.">
<link rel="canonical" href="https://yeamin-talukder.github.io/jolpai-keyboard/privacy.html">
<meta name="theme-color" content="#151a10">
<meta property="og:type" content="article">
<meta property="og:title" content="Privacy policy – Jolpai Keyboard">
<meta property="og:url" content="https://yeamin-talukder.github.io/jolpai-keyboard/privacy.html">
<meta property="og:image" content="https://yeamin-talukder.github.io/jolpai-keyboard/images/banner.png">
<link rel="icon" type="image/png" href="images/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #11150d; --bg-2: #171d12; --line: #313c25; --text: #eef2e2; --muted: #b4bea0; --olive: #b5c94a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Hind Siliguri', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 17px; line-height: 1.65; }
  a { color: var(--olive); }
  header { border-bottom: 1px solid var(--line); background: var(--bg-2); }
  .bar { max-width: 900px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 10px; }
  .bar a { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-weight: 700; }
  .bar img { width: 30px; height: 30px; border-radius: 8px; }
  main { max-width: 900px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: clamp(30px, 5vw, 40px); line-height: 1.15; }
  h2 { margin-top: 2em; font-size: 24px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  p, li { color: var(--muted); }
  strong { color: var(--text); }
  code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; background: rgba(255,255,255,.06); padding: 1px 6px; border-radius: 6px; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 15.5px; margin: 1em 0; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--bg-2); color: var(--text); }
  td { color: var(--muted); }
  footer { border-top: 1px solid var(--line); color: #8a957a; font-size: 15px; }
  footer div { max-width: 900px; margin: 0 auto; padding: 24px 20px 40px; }
  .markdown-heading .anchor { display: none; }
</style>
</head>
<body>
<header><div class="bar"><a href="./"><img src="images/icon-512.png" alt="" width="30" height="30">Jolpai Keyboard</a></div></header>
<main>
{{BODY}}
</main>
<footer><div><a href="./">← Back to Jolpai Keyboard</a> · <a href="https://github.com/Yeamin-Talukder/jolpai-keyboard/blob/main/docs/PRIVACY.md">This policy on GitHub</a></div></footer>
</body>
</html>
